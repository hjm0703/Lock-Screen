<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/lock.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock Screen</title>
    <script type="module" src="/src/lock.ts" defer></script>
  </head>
  <body>
    <img id="lock-bg-img" class="lock-bg-img" alt="" />

    <!-- 解锁欢迎画面 -->
    <div id="welcome-screen" class="welcome-screen">
      <div class="welcome-content">
        <div class="welcome-text">欢迎</div>
        <div class="welcome-spinner">
          <div class="spinner-dot"></div>
          <div class="spinner-dot"></div>
          <div class="spinner-dot"></div>
          <div class="spinner-dot"></div>
          <div class="spinner-dot"></div>
        </div>
      </div>
    </div>

    <div id="lock-overlay">
      <!-- 时钟区域 -->
      <div class="clock-section">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date">----年--月--日 星期-</div>
      </div>

      <!-- 锁屏交互区域 -->
      <div class="lock-form-section hidden">
        <svg class="pin-icon" viewBox="0 0 60 72" fill="none">
          <circle cx="30" cy="8" r="3" fill="currentColor"/>
          <circle cx="14" cy="28" r="3" fill="currentColor"/>
          <circle cx="30" cy="28" r="3" fill="currentColor"/>
          <circle cx="46" cy="28" r="3" fill="currentColor"/>
          <circle cx="14" cy="44" r="3" fill="currentColor"/>
          <circle cx="30" cy="44" r="3" fill="currentColor"/>
          <circle cx="46" cy="44" r="3" fill="currentColor"/>
          <circle cx="14" cy="60" r="3" fill="currentColor"/>
          <circle cx="30" cy="60" r="3" fill="currentColor"/>
          <circle cx="46" cy="60" r="3" fill="currentColor"/>
        </svg>
        <div class="lock-form">
          <input
            id="unlock-password"
            type="password"
            placeholder="输入密码"
            autocomplete="off"
          />
          <button id="btn-unlock" class="btn-unlock" aria-label="解锁">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
        <div class="password-hint" id="password-hint-display"></div>
        <div class="caps-hint" id="unlock-caps-hint">大写锁定已开启</div>
        <div id="unlock-message" class="unlock-message"></div>
        <div class="click-hint" id="click-hint">鼠标点击无效 · 请按 Enter 键解锁</div>
      </div>

      <div class="breathing-indicator"></div>
      <div class="lock-timestamp" id="lock-timestamp"></div>
    </div>
  </body>
</html>

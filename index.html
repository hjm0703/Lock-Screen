<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock Screen</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <svg style="display: none;">
      <defs>
        <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </symbol>
        <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </symbol>
        <symbol id="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </symbol>
        <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </symbol>
        <symbol id="icon-minimize" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="4" y1="8" x2="12" y2="8"/>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="4" y1="4" x2="12" y2="12"/>
          <line x1="12" y1="4" x2="4" y2="12"/>
        </symbol>
      </defs>
    </svg>

    <div id="app">
      <div id="titlebar" class="titlebar">
        <span class="titlebar-title">Lock Screen 设置</span>
        <div class="titlebar-controls">
          <button id="btn-minimize" class="titlebar-btn" title="最小化">
            <svg class="icon-titlebar"><use href="#icon-minimize"/></svg>
          </button>
          <button id="btn-close" class="titlebar-btn" title="关闭">
            <svg class="icon-titlebar"><use href="#icon-close"/></svg>
          </button>
        </div>
      </div>
      <div id="main-container">
        <nav id="sidebar">
          <div class="sidebar-header">
            <svg class="icon-sidebar"><use href="#icon-lock"/></svg>
            <span class="sidebar-title">Lock Screen</span>
          </div>
          <ul class="sidebar-nav">
            <li class="nav-item active" data-page="home">
              <svg class="nav-icon-svg"><use href="#icon-home"/></svg>
              <span class="nav-text">开始</span>
            </li>
            <li class="nav-item" data-page="password">
              <svg class="nav-icon-svg"><use href="#icon-key"/></svg>
              <span class="nav-text">设置密码</span>
            </li>
            <li class="nav-item" data-page="lock">
              <svg class="nav-icon-svg"><use href="#icon-play"/></svg>
              <span class="nav-text">开始锁屏</span>
            </li>
            <li class="nav-item" data-page="settings">
              <svg class="nav-icon-svg"><use href="#icon-settings"/></svg>
              <span class="nav-text">通用设置</span>
            </li>
          </ul>
        </nav>
        <main id="content">
          <section id="page-home" class="page active">
            <div class="page-content home-page">
              <svg class="icon-welcome"><use href="#icon-shield"/></svg>
              <h1 class="page-title">欢迎使用 Lock Screen</h1>
              <p class="page-desc">一个简单的电脑锁屏应用，保护您的隐私安全</p>
              <div class="home-actions">
                <div class="action-card" data-goto="password">
                  <svg class="action-icon-svg"><use href="#icon-key"/></svg>
                  <div class="action-text">
                    <h3>设置密码</h3>
                    <p>设置您的锁屏密码</p>
                  </div>
                </div>
                <div class="action-card" data-goto="settings">
                  <svg class="action-icon-svg"><use href="#icon-settings"/></svg>
                  <div class="action-text">
                    <h3>通用设置</h3>
                    <p>配置应用选项</p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="page-password" class="page">
            <div class="page-content password-page">
              <h2 class="page-title">设置密码</h2>
              <p class="page-desc" id="password-page-desc">请设置一个安全的密码来锁定您的屏幕</p>
              <div class="form-container">
                <div class="form-group" id="old-password-group" style="display:none">
                  <label for="old-password">原密码</label>
                  <input id="old-password" type="password" placeholder="请输入原密码" />
                </div>
                <div class="form-group">
                  <label for="new-password">新密码</label>
                  <input id="new-password" type="password" placeholder="请输入密码" />
                </div>
                <div class="form-group">
                  <label for="confirm-password">确认密码</label>
                  <input id="confirm-password" type="password" placeholder="请再次输入密码" />
                </div>
                <div id="password-message" class="message"></div>
                <button id="btn-save-password" class="btn btn-primary">保存密码</button>
              </div>
            </div>
          </section>

          <section id="page-lock" class="page">
            <div class="page-content lock-page">
              <svg class="icon-welcome"><use href="#icon-lock"/></svg>
              <h2 class="page-title">开始锁屏</h2>
              <p class="page-desc">锁定屏幕以保护您的隐私，解锁需要输入密码</p>
              <div class="lock-start-form">
                <div class="form-group">
                  <label for="lock-password">密码验证</label>
                  <input id="lock-password" type="password" placeholder="请输入当前密码以开始锁屏" />
                </div>
                <div id="lock-message" class="message"></div>
                <button id="btn-start-lock" class="btn btn-primary">立即锁屏</button>
              </div>
            </div>
          </section>

          <section id="page-settings" class="page">
            <div class="page-content settings-page">
              <h2 class="page-title">通用设置</h2>
              <div class="settings-list">
                <div class="setting-item">
                  <div class="setting-info">
                    <span class="setting-label">启动时自动隐藏窗口</span>
                    <span class="setting-desc">程序启动时自动隐藏到托盘</span>
                  </div>
                  <label class="toggle-switch">
                    <input type="checkbox" id="setting-auto-hide" />
                    <span class="toggle-slider"></span>
                  </label>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
